%dev.quarkus.http.port=8080

quarkus.rest-client.users.url=http://localhost:8081
quarkus.rest-client.recommendations.url=http://localhost:8083
quarkus.rest-client.movies.url=http://localhost:8082
# A search makes two AI calls of up to 65 s each in recommendations.
quarkus.rest-client.recommendations.read-timeout=140000

# After a profile save edge waits this long for the recommendations refresh, then answers anyway.
edge.profile.refresh-timeout=15s
%test.edge.profile.refresh-timeout=1s

%prod.quarkus.rest-client.users.url=http://users:8080
%prod.quarkus.rest-client.recommendations.url=http://recommendations:8080
%prod.quarkus.rest-client.movies.url=http://movies:8080

# Random port for @QuarkusTest, so tests and quarkus:dev can run side by side.
quarkus.http.test-port=0

# JWT. edge only verifies tokens (users issues them), so it gets the public key only.
mp.jwt.verify.issuer=g2-users

# TEST-ONLY public key on the test classpath (src/test/resources, never packaged).
%test.mp.jwt.verify.publickey.location=test-public.pem

# Dev key comes from app/keys/gen-dev-keys.sh; the path is relative to the edge module, the working directory of quarkus:dev.
%dev.mp.jwt.verify.publickey.location=../keys/dev/publicKey.pem

# Prod: deliberately NO key property here and no fallback to the dev or test keys. Supply
# MP_JWT_VERIFY_PUBLICKEY_LOCATION from a mounted Secret; edge never receives the private key.

# Deny by default: every JAX-RS method must carry @PermitAll or @Authenticated, or it is denied.
quarkus.security.jaxrs.deny-unannotated-endpoints=true
