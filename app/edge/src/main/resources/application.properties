quarkus.application.name=edge

%dev.quarkus.http.port=8080

# REST clients, addressed by configKey.
quarkus.rest-client.users.url=http://localhost:8081
quarkus.rest-client.recommendations.url=http://localhost:8083

# In-cluster / compose targets; override per environment.
%prod.quarkus.rest-client.users.url=http://users:8080
%prod.quarkus.rest-client.recommendations.url=http://recommendations:8080
