%dev.quarkus.http.port=8082

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.db-name=movies_db
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg18
quarkus.flyway.migrate-at-start=true

movies.seed.url=https://files.grouplens.org/datasets/movielens/ml-32m.zip
movies.seed.cache-dir=${java.io.tmpdir}/g2-movielens

movies.images.poster-url=https://images.metahub.space/poster/medium/%s/img
movies.images.banner-url=https://images.metahub.space/background/medium/%s/img

movies.meta.url=https://v3-cinemeta.strem.io/meta/movie/%s.json
movies.meta.timeout=5s

# Relative to the movies module, the working directory of quarkus:dev; set MOVIES_EMBEDDINGS_FILE elsewhere.
movies.embeddings.file=../../../data/embeddings/movielens_qwen3_embedding_0.6b.csv
