quarkus.application.name=recommendations

%dev.quarkus.http.port=8083

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.db-name=recs_db
quarkus.flyway.migrate-at-start=true

quarkus.rest-client.ai.url=http://127.0.0.1:8084
quarkus.rest-client.ai.connect-timeout=3000
quarkus.rest-client.ai.read-timeout=65000
quarkus.rest-client.movies.url=http://127.0.0.1:8082
quarkus.rest-client.movies.connect-timeout=2000
quarkus.rest-client.movies.read-timeout=5000
quarkus.rest-client.users.url=http://127.0.0.1:8081
quarkus.rest-client.users.connect-timeout=2000
quarkus.rest-client.users.read-timeout=3000

%prod.quarkus.rest-client.ai.url=http://ai:8080
%prod.quarkus.rest-client.movies.url=http://movies:8080
%prod.quarkus.rest-client.users.url=http://users:8080

# Live search sizes.
recs.search.candidates=15
recs.search.picks=3

recs.agent.every=10m
