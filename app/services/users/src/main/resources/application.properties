quarkus.application.name=users

# Container/runtime port stays 8080; dev mode uses a distinct port so all
# modules can run side by side.
%dev.quarkus.http.port=8081

# users_db: dedicated Postgres instance, not shared. In dev, Dev Services spins
# up a Postgres container automatically when no URL is set.
quarkus.datasource.db-kind=postgresql

# Production overrides (set via env vars / k8s secrets).
%prod.quarkus.datasource.username=${USERS_DB_USER}
%prod.quarkus.datasource.password=${USERS_DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${USERS_DB_URL}

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.mapping.format.global=ignore
