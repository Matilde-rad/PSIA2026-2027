quarkus.application.name=users

# Container/runtime port stays 8080; dev mode uses a distinct port so all
# modules can run side by side.
%dev.quarkus.http.port=8081

# users_db: dedicated Postgres instance, not shared with other services.
# In dev and test, Dev Services starts a throwaway Postgres container (needs
# Docker), so no URL is set. In prod, supply it through the environment:
#   QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
quarkus.datasource.db-kind=postgresql

# The schema is owned by the Flyway scripts in db/migration, not by Hibernate.
# validate makes startup fail if the entities and the tables disagree.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
# The profile lists are jsonb columns. Hibernate uses its own JSON mapper for them, not the
# REST one; without this Quarkus refuses to start.
quarkus.hibernate-orm.mapping.format.global=ignore

# Random HTTP port for @QuarkusTest: 8081 is the users dev port, so tests and
# quarkus:dev can run side by side.
quarkus.http.test-port=0

# bcrypt cost, used by register and login.
# Production keeps 12; the low cost applies to the test profile only (fast tests).
users.bcrypt.cost=12
%test.users.bcrypt.cost=4

# JWT. One issuer literal on the signing and the verifying side (edge copies the
# verify side in Phase 4).
smallrye.jwt.new-token.issuer=g2-users
mp.jwt.verify.issuer=g2-users
# Token lifespan: 1 h (the smallrye default is 300 s). TokenIssuer reads this one property.
smallrye.jwt.new-token.lifespan=3600

# TEST-ONLY signing/verifying pair on the test classpath (src/test/resources, never packaged).
%test.smallrye.jwt.sign.key.location=test-private.pem
%test.mp.jwt.verify.publickey.location=test-public.pem

# Dev keys come from app/keys/gen-dev-keys.sh (run it once before quarkus:dev). The path is
# relative to the users module directory, which is the working directory of quarkus:dev.
%dev.smallrye.jwt.sign.key.location=../../keys/dev/privateKey.pem
%dev.mp.jwt.verify.publickey.location=../../keys/dev/publicKey.pem

# Prod: deliberately NO key properties here and no fallback to the dev or test keys. Supply them
# from the environment, pointing at files of a mounted Secret:
#   SMALLRYE_JWT_SIGN_KEY_LOCATION=file:/etc/jwt/privateKey.pem
#   MP_JWT_VERIFY_PUBLICKEY_LOCATION=file:/etc/jwt/publicKey.pem
# The private key belongs only in the users pod (edge gets only the public key, in Phase 4).
# Prefer the *_LOCATION form over inlining a key in an environment variable.
# Token-level debug logging of the JWT validator category prints token details: fine locally,
# never commit it.

# Deny by default: every JAX-RS method must carry @PermitAll or @Authenticated, or it is denied.
# Only register (POST /users) and login (POST /auth/login) are public. /q/health and /q/openapi
# are not JAX-RS endpoints and stay public for probes. Proactive authentication stays at the
# Quarkus default: public endpoints are called without an Authorization header (a stale bearer
# sent to register/login gets the JSON 401).
quarkus.security.jaxrs.deny-unannotated-endpoints=true
