quarkus.application.name=ai

%dev.quarkus.http.port=8084

quarkus.rest-client.ollama.url=http://127.0.0.1:11434
%prod.quarkus.rest-client.ollama.url=http://ollama:11434
quarkus.rest-client.ollama.connect-timeout=3000
quarkus.rest-client.ollama.read-timeout=30000

# The same model and version as the movie vectors in data/embeddings.
ai.embed.model=qwen3-embedding:0.6b
ai.options.keep-alive=30m
