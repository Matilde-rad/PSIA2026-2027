apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: g2

resources:
  - namespace.yaml
  - apps/users/users-db.yaml
  - apps/users/users.yaml
  - apps/movies/movies-db.yaml
  - apps/movies/movies.yaml
  - apps/recommendations/recs-db.yaml
  - apps/recommendations/recommendations.yaml
  - apps/ai/ollama.yaml
  - apps/ai/ai.yaml
  - apps/edge/edge.yaml
  - apps/web/web.yaml

# What Argo CD deploys. CI's deploy job writes the build VM's registry and the commit's
# tag here on every master pipeline; 6-deploy.yml overrides both in a temporary copy.
images:
  - name: users
    newName: 10.164.0.4:5000/users
    newTag: aa4b46f1
  - name: movies
    newName: 10.164.0.4:5000/movies
    newTag: aa4b46f1
  - name: recommendations
    newName: 10.164.0.4:5000/recommendations
    newTag: aa4b46f1
  - name: ai
    newName: 10.164.0.4:5000/ai
    newTag: aa4b46f1
  - name: edge
    newName: 10.164.0.4:5000/edge
    newTag: aa4b46f1
  - name: web
    newName: 10.164.0.4:5000/web
    newTag: aa4b46f1
