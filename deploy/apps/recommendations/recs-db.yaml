apiVersion: v1
kind: Service
metadata:
  name: recs-db
spec:
  selector:
    app: recs-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recs-db
spec:
  serviceName: recs-db
  replicas: 1
  selector:
    matchLabels:
      app: recs-db
  template:
    metadata:
      labels:
        app: recs-db
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_DB
              value: recs_db
            - name: POSTGRES_USER
              value: recs
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g2
                  key: recs-db-password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "recs", "-d", "recs_db"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
