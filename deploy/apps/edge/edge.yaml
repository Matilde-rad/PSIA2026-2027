apiVersion: v1
kind: Service
metadata:
  name: edge
spec:
  selector:
    app: edge
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      labels:
        app: edge
    spec:
      containers:
        - name: edge
          image: edge
          env:
            - name: MP_JWT_VERIFY_PUBLICKEY_LOCATION
              value: file:/etc/jwt/publicKey.pem
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
          volumeMounts:
            - name: jwt
              mountPath: /etc/jwt
              readOnly: true
      volumes:
        - name: jwt
          secret:
            secretName: jwt
            items:
              - key: publicKey.pem
                path: publicKey.pem
