---
# Step 2: install the container runtime and the Kubernetes packages on every node.
# https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/install-kubeadm/

- name: Install containerd, kubelet, kubeadm and kubectl
  hosts: cluster
  become: true

  vars:
    # Keep in step with KUBECTL_VERSION in infra/Dockerfile.
    k8s_minor: v1.37
    k8s_version: 1.37.1-1.1

  tasks:
    # python3-debian is needed by deb822_repository below.
    - name: Install containerd and python3-debian
      ansible.builtin.apt:
        name:
          - containerd
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    # kubelet and containerd must use the same cgroup driver (systemd).
    # config_path: read the registry hosts.toml from 1-node-prep.yml (no default in 2.0/2.1).
    - name: Configure containerd (systemd cgroups, registry hosts)
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: |
          version = 3

          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc.options]
            SystemdCgroup = true

          [plugins.'io.containerd.cri.v1.images'.registry]
            config_path = '/etc/containerd/certs.d'
        mode: "0644"
      notify: Restart containerd

    - name: Add the Kubernetes apt repo
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: deb
        uris: https://pkgs.k8s.io/core:/stable:/{{ k8s_minor }}/deb/
        suites: /
        signed_by: https://pkgs.k8s.io/core:/stable:/{{ k8s_minor }}/deb/Release.key
        state: present

    - name: Install kubelet, kubeadm and kubectl
      ansible.builtin.apt:
        name:
          - kubelet={{ k8s_version }}
          - kubeadm={{ k8s_version }}
          - kubectl={{ k8s_version }}
        state: present
        update_cache: true

    # So an apt upgrade never moves a node to another Kubernetes version.
    - name: Hold the Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
